<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Página não encontrada · Caramujo Records</title>
<meta name="theme-color" content="#050403"/>
<link rel="icon" type="image/svg+xml" href="/assets/brand/selo-creme.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
:root{--black:#14110d;--deep:#1A1815;--clay:#A87B4A;--bone:#E8E0CF;--cream:#f2ecdf;
  --ember:#A87B4A;--fire:#b98f5e;--wire:#332c22;--read:#b89e72}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--bone);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:2rem 1.4rem;
  -webkit-text-size-adjust:100%}
main{max-width:520px;width:100%}
.selo{width:44px;height:44px;opacity:.8;display:block;margin-bottom:2.2rem}
.codigo{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--clay);margin:0}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(2.4rem,9vw,3.6rem);
  line-height:1.05;color:var(--cream);margin:.5rem 0 0}
p.texto{font-size:.95rem;line-height:1.6;color:var(--read);margin:1.1rem 0 0;max-width:42ch}
.saidas{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:2rem}
a.btn{font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:.1em;
  text-transform:uppercase;text-decoration:none;padding:.7rem 1.6rem;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s,color .18s}
.fogo{background:var(--ember);color:var(--cream)}
.fogo:hover{background:var(--fire)}
.fantasma{background:transparent;color:var(--bone);border:1px solid var(--wire)}
.fantasma:hover{border-color:var(--clay);color:var(--cream)}
</style>
</head>
<body>
<main>
  <img class="selo" src="/assets/brand/selo-creme.svg" alt="Caramujo Records" width="44" height="44"/>
  <p class="codigo">Erro 404</p>
  <h1>Essa página não existe</h1>
  <p class="texto">Ou o beat já foi vendido e saiu do catálogo, ou o link veio torto.
    Os beats à venda estão todos na home.</p>
  <div class="saidas">
    <a class="btn fogo" href="/#beats">Ouvir o catálogo</a>
    <a class="btn fantasma" href="/">Voltar pro início</a>
  </div>
</main>
</body>
</html>
