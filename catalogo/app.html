<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/assets/brand/selo-creme.svg">
<link rel="icon" type="image/png" href="/assets/brand/Caramujo_Records.png">
<link rel="apple-touch-icon" href="/assets/brand/Caramujo_Records.png">
<title>__TITULO__</title>
__META__
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#000000;
    --panel:rgba(17,17,17,.72);
    --panel-solid:#0f0f0f;
    --edge:rgba(255,255,255,.09);
    --ink:#ffffff;
    --ink-2:#b7b7b7;
    --ink-3:#8a8a8a;
    --ink-4:#6a6a6a;
    --ink-5:#454545;
    --sheet:#141414;
    --logo:url('/assets/brand/caramujo-h.webp');
    --logo-v:url('/assets/brand/caramujo-v.webp');
    --sans:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  button,input,textarea,select{font-family:inherit;color:inherit}
  button{-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid #fff;outline-offset:2px}
  .logo{display:block;background:var(--logo) center/contain no-repeat}
  .logo-v{background-image:var(--logo-v)}


  .bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#050505;
  }
  .bg i{
    position:absolute;inset:-14%;display:block;
    background:#050505 center/cover no-repeat;
    background-image:
      radial-gradient(circle at 24% 16%, rgba(255,255,255,.20), rgba(255,255,255,0) 32%),
      radial-gradient(circle at 70% 30%, rgba(255,255,255,.12), rgba(255,255,255,0) 30%),
      radial-gradient(circle at 40% 82%, rgba(255,255,255,.10), rgba(255,255,255,0) 34%);
    filter:blur(34px) saturate(1.15);
    transform:scale(1.28);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(130% 100% at 50% 38%, rgba(0,0,0,.42), rgba(0,0,0,.88) 78%),
      linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55));
  }

  .stage{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}

  .brand{
    display:flex;align-items:center;
    padding:11px 16px 7px;
    padding-top:calc(11px + env(safe-area-inset-top,0px));
  }
  .brand-link{display:inline-flex;align-items:center;text-decoration:none;padding:2px}
  .brand-link .logo{width:122px;height:22px;opacity:.92}
  .brand-link:hover .logo{opacity:1}

  .content{flex:1;display:flex;flex-direction:column}

  .art{padding:0;display:flex;justify-content:center}
  .cover{
    position:relative;width:min(88%,46vh);aspect-ratio:1/1;max-width:100%;
    background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .cover .logo{width:62%;aspect-ratio:403/250}
  .trocar{
    position:absolute;right:10px;bottom:10px;z-index:2;
    display:flex;align-items:center;gap:7px;
    padding:9px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:#e8e8e8;font-size:12px;font-weight:500;cursor:pointer;
  }
  .trocar[hidden]{display:none}
  .trocar:active{background:rgba(0,0,0,.75)}

  .panel{
    padding:0 16px 24px;
    background:linear-gradient(180deg,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,.55) 26px,
      rgba(0,0,0,.88) 120px,
      #000 300px);
  }
  .art{padding-top:10px}
  .head{padding-top:16px}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  h1{margin:0;font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.02;overflow-wrap:anywhere}
  .who{margin-top:10px;font-size:14px;color:var(--ink-2)}
  .count{margin-top:4px;font-size:14px;color:var(--ink-4)}
  .recado{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--ink-2);
    max-width:46ch;overflow-wrap:anywhere;white-space:pre-line}

  .searchbox{display:flex;align-items:center;gap:10px;margin-top:16px;
    background:#121212;border:1px solid #232323;border-radius:12px;padding:11px 14px}
  .searchbox[hidden]{display:none}
  .searchbox input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:15px}
  .searchbox input::placeholder{color:#5a5a5a}

  .actions{display:flex;align-items:center;gap:24px;margin-top:16px}
  .play-all{width:46px;height:46px;margin-left:-5px;padding:0;background:transparent;border:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .txt-btn{display:flex;align-items:center;gap:8px;padding:8px 0;background:transparent;border:0;
    font-size:13px;font-weight:500;letter-spacing:.1em;color:#dcdcdc;cursor:pointer}
  .txt-btn:active{opacity:.6}

  .navwrap{position:sticky;top:0;z-index:7;background:#000;margin-top:14px}
  .tabsbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
  .tabs{display:flex;gap:26px}
  .tab{padding:0 0 10px;background:transparent;border:0;border-bottom:2px solid transparent;
    font-size:16px;font-weight:600;color:#909090;cursor:pointer}
  .tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
  .order{display:flex;align-items:center;gap:7px;padding:0 0 10px;background:transparent;border:0;
    font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .tabsbar-line{height:1px;background:rgba(255,255,255,.07)}

  .list{padding-top:4px;min-height:120px;padding-bottom:118px}
  .group{padding:15px 0 3px;font-size:10.5px;font-weight:600;letter-spacing:.2em;color:#949494}
  .row{width:100%;display:flex;align-items:center;gap:13px;padding:9px 0;
    background:transparent;border:0;text-align:left;cursor:pointer}
  .row.sel-mode{cursor:default}
  .lead{width:22px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-start}
  .num{font-size:12px;color:var(--ink-4);font-variant-numeric:tabular-nums}
  .eq{display:flex;align-items:flex-end;gap:2px;height:13px}
  .eq i{width:2px;display:block;background:var(--ink);height:4px;animation:bump .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.18s}
  .eq i:nth-child(3){animation-delay:.36s}
  @keyframes bump{0%,100%{height:3px}50%{height:12px}}
  .eq.paused i{animation-play-state:paused;height:7px}
  @media (prefers-reduced-motion:reduce){.eq i{animation:none;height:7px}}
  .box{width:20px;height:20px;border:1.5px solid #4e4e4e;border-radius:5px;display:flex;
    align-items:center;justify-content:center;flex-shrink:0}
  .box.on{background:#fff;border-color:#fff}
  .box svg{display:none}
  .box.on svg{display:block}

  .meta{flex:1;min-width:0;display:flex;flex-direction:column}
  .name{display:block;font-size:15px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
  .row[aria-current="true"] .name{color:#fff}
  .sub{display:block;margin-top:2px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .dur{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex-shrink:0}
  .more{width:32px;height:32px;flex-shrink:0;padding:0;background:transparent;border:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-3)}

  .empty{padding:26px 0;font-size:14px;color:#5a5a5a}
  .foot{padding:6px 0 0;border-top:1px solid rgba(255,255,255,.06);
    display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .foot .brand-link{padding:16px 2px 0}
  .foot .brand-link .logo{width:164px;height:30px;opacity:1}
  .foot .brand-link:hover .logo{opacity:.75}
  .foot-note{font-size:10px;letter-spacing:.16em;color:#333}

  body.is-preview .tabsbar,
  body.is-preview .tabsbar-line,
  body.is-preview #pickSend,
  body.is-preview #searchBtn,
  body.is-preview .selbar{display:none}

  .selbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0 2px;border-bottom:1px solid rgba(255,255,255,.07)}
  .selbar[hidden]{display:none}
  .link-btn{background:transparent;border:0;padding:8px 0;font-size:14px;color:var(--ink-2);cursor:pointer}
  .selbar strong{font-size:14px;font-weight:600;color:#fff}

  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(12,12,12,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.08);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .dock[hidden]{display:none}
  .dock-in{max-width:1180px;margin:0 auto;padding:7px 16px 9px}

  .pl-top{display:flex;align-items:center;gap:11px}
  .pl-art{width:40px;height:40px;flex-shrink:0;background:#000;border:1px solid #1e1e1e;
    display:flex;align-items:center;justify-content:center}
  .pl-art .logo{width:84%;height:84%;opacity:.9}
  .pl-meta{flex:1;min-width:0}
  .pl-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-sub{margin-top:2px;font-size:12px;color:var(--ink-4);font-variant-numeric:tabular-nums}
  .pl-btn{width:44px;height:44px;flex-shrink:0;padding:0;background:transparent;border:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
  .pl-btn small{font-size:9px;font-weight:600;position:absolute;color:#fff}
  .skip{position:relative}

  .scrub{display:flex;align-items:center;gap:10px;margin-top:2px}
  .scrub time{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;width:38px;flex-shrink:0}
  .scrub time.r{text-align:right}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:22px;background:transparent;margin:0;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(#fff,#fff) 0/var(--pct,0%) 100% no-repeat,#333}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#333}
  input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:#fff}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;margin-top:-5px;box-shadow:0 0 0 4px rgba(0,0,0,.35)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}

  .dl-dock{display:flex;align-items:center;gap:10px}
  .dl-dock .pill{flex:1;justify-content:center}
  .dl-dock .pill.solid{flex:1.4}
  .pill{display:flex;align-items:center;gap:7px;padding:13px 16px;border-radius:999px;
    border:1px solid #2c2c2c;background:#181818;color:#fff;font-size:14px;font-weight:500;cursor:pointer}
  .pill.solid{background:#fff;color:#000;border-color:#fff}
  .pill:disabled{opacity:.4;cursor:default}

  .veil{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);
    display:flex;align-items:flex-end;justify-content:center}
  .veil[hidden]{display:none}
  .card{
    width:100%;max-width:520px;background:var(--sheet);border:1px solid #232323;
    border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));
  }
  .card h2{margin:0 0 3px;font-size:17px;font-weight:600;overflow-wrap:anywhere}
  .card p{margin:0;font-size:13px;color:var(--ink-4)}
  .card-list{display:flex;flex-direction:column;gap:2px;margin-top:16px}
  .card-list button{display:flex;align-items:center;gap:13px;width:100%;padding:14px 10px;
    background:transparent;border:0;border-radius:12px;font-size:15px;color:#efefef;text-align:left;cursor:pointer}
  .card-list button:active{background:#1d1d1d}
  .fmt{display:flex;gap:10px;margin-top:16px}
  .fmt button{flex:1;padding:15px 12px;border-radius:14px;border:1px solid #2c2c2c;background:#1a1a1a;
    color:#fff;cursor:pointer;text-align:left}
  .fmt b{display:block;font-size:15px;font-weight:600}
  .fmt span{display:block;margin-top:3px;font-size:12px;color:var(--ink-3)}
  .fmt em{display:block;margin-top:7px;font-size:11px;font-style:normal;color:var(--ink-5);
    font-variant-numeric:tabular-nums}
  .linkbox{display:flex;align-items:center;gap:10px;margin-top:16px;background:#101010;
    border:1px solid #242424;border-radius:12px;padding:12px 14px}
  .linkbox code{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghost{padding:10px 14px;border-radius:10px;border:1px solid #2c2c2c;background:#1c1c1c;
    color:#fff;font-size:13px;font-weight:500;cursor:pointer}
  .card-close{margin-top:14px;width:100%;padding:13px;border-radius:12px;border:1px solid #2a2a2a;
    background:transparent;color:var(--ink-2);font-size:14px;cursor:pointer}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:60;
    background:#1d1d1d;border:1px solid #2d2d2d;color:#e2e2e2;font-size:13px;
    padding:11px 15px;border-radius:12px;max-width:86%;text-align:center;
    transition:opacity .25s;pointer-events:none}
  .toast[hidden]{display:none}

  @media (min-width:900px){
    .brand{padding:22px 32px;position:fixed;top:0;left:0;z-index:5}
    .stage{height:100%;justify-content:center}
    .content{flex:none;flex-direction:row;align-items:center;justify-content:center;
      gap:56px;padding:40px 40px;max-width:1500px;margin:0 auto;width:100%}
    .art{flex:0 0 clamp(280px,32vw,420px)}
    .cover{box-shadow:0 30px 80px rgba(0,0,0,.6)}
    .list{padding-bottom:16px;min-height:120px}
    .art{padding-top:0}
    .panel{
      flex:0 1 700px;max-height:min(74vh,860px);overflow-y:auto;
      background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
      border:1px solid var(--edge);border-radius:26px;padding:6px 30px 30px;
    }
    .head{padding-top:24px}
    h1{font-size:44px}
    .brand-link .logo{width:148px;height:27px}
    .navwrap{position:static;background:transparent;margin-top:20px}
    .tabsbar{padding-top:0}
    .tab{font-size:17px;padding-bottom:11px}
    .order{padding-bottom:11px}
    .who{margin-top:14px;font-size:15px}
    .count{margin-top:6px;font-size:15px}
    .actions{gap:26px;margin-top:22px}
    .play-all{width:52px;height:52px}
    .row{padding:12px 0;gap:14px}
    .name{font-size:16px}
    .sub{margin-top:4px;font-size:13px}
    .dur{font-size:13px}
    .group{padding:20px 0 6px}
    .cover{width:100%;aspect-ratio:1/1}
    .dock-in{padding:10px 24px 12px}
    .pl-art{width:44px;height:44px}
    .dock-in{padding:12px 24px 14px}
    .dl-dock{max-width:560px;margin:0 auto}
    .veil{align-items:center}
    .card{border-radius:20px}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><i id="fundo"></i></div>

<div class="stage">
  <header class="brand">
    <a class="brand-link" href="https://caramujorecords.com.br" target="_blank" rel="noopener" aria-label="Caramujo Records">
      <span class="logo" role="img" aria-label="Caramujo Records"></span>
    </a>
  </header>

  <main class="content">
    <div class="art">
      <div class="cover" id="capa">
        <span class="logo logo-v" role="img" aria-label="Caramujo Records"></span>
        <button class="trocar" id="trocarCapa" type="button" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 014.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0121 8.5v9A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
          Trocar capa
        </button>
        <label for="arquivoCapa" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Escolher imagem da capa</label>
        <input id="arquivoCapa" type="file" accept="image/*" hidden>
      </div>
    </div>

    <section class="panel">
      <div class="head">
        <div class="title-row">
          <h1 id="nome">—</h1>
          <button class="pl-btn" id="searchBtn" type="button" aria-label="Buscar faixa" style="margin-top:2px">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#e6e6e6" stroke-width="1.9" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>
          </button>
        </div>
        <div class="who" id="who">@rideblan33</div>
        <div class="count" id="count">—</div>
        <p class="recado" id="recado" hidden></p>

        <div class="searchbox" id="searchbox" hidden>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6a6a6a" stroke-width="1.9" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>
          <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar faixa</label>
          <input id="q" type="search" placeholder="Buscar no catálogo" autocomplete="off">
        </div>

        <div class="actions">
          <button class="play-all" id="playAll" type="button" aria-label="Tocar tudo">
            <svg width="34" height="36" viewBox="0 0 24 24" fill="#9a9a9a" aria-hidden="true"><path d="M6 3l15 9-15 9z"/></svg>
          </button>
          <button class="txt-btn" id="pickSend" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.9" aria-hidden="true"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg>
            ENVIAR
          </button>
          <button class="txt-btn" id="pickDown" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.9" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
            BAIXAR
          </button>
        </div>
      </div>

      <div class="navwrap">
      <div class="tabsbar">
        <div class="tabs" role="tablist">
          <button class="tab" id="tabBeats" role="tab" aria-selected="true" type="button">Beats</button>
          <button class="tab" id="tabSons" role="tab" aria-selected="false" type="button">Músicas</button>
        </div>
        <button class="order" id="orderBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b7b7b7" stroke-width="1.9" aria-hidden="true"><path d="M8 4v16"/><path d="M5 7l3-3 3 3"/><path d="M16 20V4"/><path d="M13 17l3 3 3-3"/></svg>
          <span id="orderLabel">Ordem</span>
        </button>
      </div>
      <div class="tabsbar-line"></div>
      </div>

      <div class="selbar" id="selbar" hidden>
        <button class="link-btn" id="selAll" type="button">Selecionar tudo</button>
        <strong id="selCount">0 faixas</strong>
      </div>

      <div class="list" id="list"></div>

      <footer class="foot">
        <a class="brand-link" href="https://caramujorecords.com.br" target="_blank" rel="noopener" aria-label="Caramujo Records">
          <span class="logo" role="img" aria-label="Caramujo Records"></span>
        </a>
      </footer>
    </section>
  </main>
</div>

<div class="dock" id="player" hidden>
  <div class="dock-in">
    <div class="pl-top">
      <div class="pl-art"><span class="logo logo-v" aria-hidden="true"></span></div>
      <div class="pl-meta">
        <div class="pl-name" id="plName">—</div>
        <div class="pl-sub" id="plSub">—</div>
      </div>
      <button class="pl-btn skip" id="back15" type="button" aria-label="Voltar 15 segundos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" aria-hidden="true"><path d="M11 5V2L6 6l5 4V7a6 6 0 11-6 6"/></svg>
        <small style="bottom:3px">15</small>
      </button>
      <button class="pl-btn" id="plToggle" type="button" aria-label="Pausar">
        <svg id="plIcon" width="19" height="19" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>
      </button>
      <button class="pl-btn skip" id="fwd15" type="button" aria-label="Avançar 15 segundos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" aria-hidden="true" style="transform:scaleX(-1)"><path d="M11 5V2L6 6l5 4V7a6 6 0 11-6 6"/></svg>
        <small style="bottom:3px">15</small>
      </button>
    </div>
    <div class="scrub">
      <time id="tNow">0:00</time>
      <label for="seek" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Posição da faixa</label>
      <input id="seek" type="range" min="0" max="100" value="0" step="1">
      <time id="tEnd" class="r">0:00</time>
    </div>
  </div>
</div>

<div class="dock" id="dlDock" hidden>
  <div class="dock-in dl-dock">
    <button class="pill" id="selCancel" type="button">Cancelar</button>
    <button class="pill solid" id="doAct" type="button" disabled>
      <svg id="doIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
      <span id="doLabel">Baixar</span>
    </button>
  </div>
</div>

<div class="veil" id="veil" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
</div>

<div class="toast" id="toast" hidden></div>

<!--DADOS-->
<script>
(function(){
  var CAT = window.__CAT__ || { artist:{ name:'', who:'@rideblan33', code:'' }, tracks:[], perm:{}, preview:null };
  var MB = 1048576;

  var BEATS = CAT.tracks.filter(function(t){ return t.kind === 'beat' });
  var SONS  = CAT.tracks.filter(function(t){ return t.kind === 'son' });

  var GROUPS = { res:null, grav:'JÁ GRAVADOS', pronta:null, guia:'GUIAS', lancada:'JÁ LANÇADAS' };
  var ORDER  = { res:0, grav:1, pronta:0, guia:1, lancada:2 };

  var tab='beats', sort='recentes', query='';
  var rows=[], cur=-1, pos=0, scrubbing=false;
  var selMode=false, selAction='down', sel={}, preview=null;
  var contados={};

  var $=function(id){return document.getElementById(id)};
  var list=$('list'), player=$('player'), dlDock=$('dlDock'), veil=$('veil'), card=$('card');

  var audio = new Audio();
  audio.preload = 'metadata';
  audio.crossOrigin = 'anonymous';

  function mmss(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
  function mb(b){return (b/MB) < 10 ? (b/MB).toFixed(1)+' MB' : Math.round(b/MB)+' MB'}
  function podeBaixar(){
    if (preview || CAT.preview) return !!CAT.perm.download;
    return tab === 'beats' ? !!CAT.perm.beats : !!CAT.perm.sons;
  }

  var VENDA = { disponivel:'disponível', vendido:'vendido' };

  function sub(t, grouped){
    if (t.kind === 'beat'){
      var bits=[];
      if (t.bpm) bits.push(t.bpm+' BPM');
      if (t.key) bits.push(t.key);
      if (t.grp === 'grav' && !grouped) bits.push('já gravado');
      if (VENDA[t.tag]) bits.push(VENDA[t.tag]);
      return bits.join(' · ');
    }
    return t.tag || '';
  }

  function data(){
    if (preview) return preview.slice();
    var src=(tab==='beats'?BEATS:SONS).slice();
    if(query){var q=norm(query);src=src.filter(function(t){return norm(t.title).indexOf(q)>-1})}
    if(sort==='az') src.sort(function(a,b){return norm(a.title)<norm(b.title)?-1:1});
    else if(sort==='bpm') src.sort(function(a,b){return (a.bpm||0)-(b.bpm||0)});
    else src.sort(function(a,b){
      if(ORDER[a.grp]!==ORDER[b.grp]) return ORDER[a.grp]-ORDER[b.grp];
      return (a.mod||'')<(b.mod||'')?1:-1;
    });
    return src;
  }

  function render(){
    rows=data();
    list.innerHTML='';
    if(!rows.length){
      var e=document.createElement('div');e.className='empty';
      e.textContent = query ? 'Nada com esse nome por aqui.' : 'Ainda não tem nada nessa aba.';
      list.appendChild(e);return;
    }
    var grouped=(sort==='recentes' && !query && !preview);
    var seen={};
    rows.forEach(function(t,i){
      if(grouped && GROUPS[t.grp] && !seen[t.grp]){
        seen[t.grp]=1;
        var g=document.createElement('div');g.className='group';g.textContent=GROUPS[t.grp];
        list.appendChild(g);
      }
      var tocando = (cur===i);
      var r=document.createElement('div');
      r.className='row'+(selMode?' sel-mode':'');
      r.setAttribute('aria-current', tocando?'true':'false');
      var lead = selMode
        ? '<span class="box'+(sel[t.id]?' on':'')+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><path d="M5 12.5l5 5 9-10"/></svg></span>'
        : (tocando
            ? '<span class="eq'+(audio.paused?' paused':'')+'" aria-hidden="true"><i></i><i></i><i></i></span>'
            : '<span class="num">'+String(i+1).padStart(2,'0')+'</span>');
      r.innerHTML =
        '<span class="lead">'+lead+'</span>'+
        '<span class="meta"><span class="name">'+esc(t.title)+'</span>'+
        '<span class="sub">'+esc(sub(t,grouped))+'</span></span>'+
        '<span class="dur">'+mmss(t.dur)+'</span>'+
        (selMode?'':'<button class="more" type="button" aria-label="Opções de '+esc(t.title)+'">'+
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>');

      if(selMode){
        r.addEventListener('click',function(){toggleSel(t.id)});
      }else{
        ['.meta','.lead','.dur'].forEach(function(sel2){
          r.querySelector(sel2).addEventListener('click',function(){pick(i)});
        });
        r.querySelector('.more').addEventListener('click',function(e){e.stopPropagation();trackSheet(t)});
      }
      list.appendChild(r);
    });
  }

  /* ---------- player ---------- */
  function pick(i){
    if(i===cur){ toggle(); return; }
    cur=i;pos=0;
    var t=rows[cur];
    player.hidden=false;dlDock.hidden=true;
    audio.src='/audio/'+t.id+'.mp3';
    audio.play().catch(function(){});
    tarja(t);
    conta(t);
    paint();render();
  }
  function toggle(){
    if(audio.paused) audio.play().catch(function(){});
    else audio.pause();
  }
  function paint(){
    var t=rows[cur];if(!t)return;
    var dur = audio.duration && isFinite(audio.duration) ? audio.duration : (t.dur || 0);
    $('plName').textContent=t.title;
    $('plSub').textContent=sub(t,false);
    $('tNow').textContent=mmss(pos);
    $('tEnd').textContent=mmss(dur);
    var sk=$('seek');
    sk.max=Math.max(1,Math.round(dur));sk.value=Math.round(pos);
    sk.style.setProperty('--pct',(dur?pos/dur*100:0)+'%');
    $('plIcon').innerHTML = audio.paused
      ? '<path d="M7 4l12 8-12 8z"></path>'
      : '<rect x="5" y="4" width="5" height="16"></rect><rect x="14" y="4" width="5" height="16"></rect>';
    $('plToggle').setAttribute('aria-label',audio.paused?'Tocar':'Pausar');
  }
  audio.addEventListener('timeupdate',function(){ if(!scrubbing){pos=audio.currentTime;paint()} });
  audio.addEventListener('loadedmetadata',function(){ paint(); tarjaPosicao(); });
  audio.addEventListener('seeked',tarjaPosicao);
  audio.addEventListener('durationchange',tarjaPosicao);
  audio.addEventListener('play',function(){
    paint();render();tarjaPosicao();
    if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing';
  });
  audio.addEventListener('pause',function(){
    paint();render();
    if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused';
  });
  audio.addEventListener('ended',function(){
    if(cur+1<rows.length) pick(cur+1);
    else { pos=0; paint(); render(); }
  });
  audio.addEventListener('error',function(){
    if(cur>-1) flash('Essa faixa ainda não está pronta. Tenta de novo daqui a pouco.');
  });

  function nudge(sec){
    if(!audio.src)return;
    audio.currentTime=Math.min(audio.duration||1e9,Math.max(0,audio.currentTime+sec));
  }
  $('plToggle').addEventListener('click',toggle);
  $('back15').addEventListener('click',function(){nudge(-15)});
  $('fwd15').addEventListener('click',function(){nudge(15)});
  $('seek').addEventListener('input',function(e){
    scrubbing=true;pos=Number(e.target.value);
    var dur=audio.duration||1;
    e.target.style.setProperty('--pct',(pos/dur*100)+'%');
    $('tNow').textContent=mmss(pos);
  });
  ['change','pointerup','touchend','mouseup'].forEach(function(ev){
    $('seek').addEventListener(ev,function(){
      if(!scrubbing)return;
      scrubbing=false;
      if(audio.src) audio.currentTime=pos;
      paint();
    });
  });
  $('playAll').addEventListener('click',function(){if(rows.length){exitSel();pick(0)}});

  /* ---------- a tarja do sistema (tela de bloqueio, notificação) ---------- */
  function arteDoSistema(){
    var c = CAT.artist.cover;
    var url = c ? location.origin + c : location.origin + '/assets/brand/Caramujo_Records.png';
    var tipo = /\.png$/i.test(url) ? 'image/png' : 'image/jpeg';
    return ['96x96','192x192','256x256','512x512'].map(function(t){
      return { src:url, sizes:t, type:tipo };
    });
  }
  function tarja(t){
    if(!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title + ' (prod. @rideblan33)',
        artist: CAT.artist.name || 'Caramujo Records',
        album: 'Caramujo Records',
        artwork: arteDoSistema()
      });
    }catch(e){}
    var liga = function(acao, fn){ try{ navigator.mediaSession.setActionHandler(acao, fn) }catch(e){} };
    liga('play', function(){ audio.play().catch(function(){}) });
    liga('pause', function(){ audio.pause() });
    liga('previoustrack', function(){
      if(audio.currentTime > 4){ audio.currentTime = 0; return; }
      if(cur > 0) pick(cur - 1);
    });
    liga('nexttrack', function(){ if(cur + 1 < rows.length) pick(cur + 1) });
    liga('seekbackward', function(d){ nudge(-(d && d.seekOffset || 15)) });
    liga('seekforward', function(d){ nudge(d && d.seekOffset || 15) });
    liga('seekto', function(d){ if(d && d.seekTime != null) audio.currentTime = d.seekTime });
    liga('stop', function(){ audio.pause(); audio.currentTime = 0 });
  }
  function tarjaPosicao(){
    if(!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
    var dur = audio.duration;
    if(!dur || !isFinite(dur)) return;
    try{
      navigator.mediaSession.setPositionState({
        duration: dur,
        position: Math.min(audio.currentTime, dur),
        playbackRate: audio.playbackRate || 1
      });
    }catch(e){}
  }

  /* ---------- audiências ---------- */
  function conta(t){
    if(contados[t.id])return;
    contados[t.id]=1;
    envia({ kind:'play', trackId:t.id, artistId:CAT.artist.id, code:CAT.code });
  }
  function envia(body){
    try{
      var s=JSON.stringify(body);
      if(navigator.sendBeacon) navigator.sendBeacon('/api/play', new Blob([s],{type:'application/json'}));
      else fetch('/api/play',{method:'POST',body:s,headers:{'content-type':'application/json'},keepalive:true});
    }catch(e){}
  }

  /* ---------- abas, busca, ordem ---------- */
  function setTab(next){
    if(tab===next)return;
    tab=next;
    $('tabBeats').setAttribute('aria-selected',String(tab==='beats'));
    $('tabSons').setAttribute('aria-selected',String(tab==='sons'));
    audio.pause();cur=-1;pos=0;player.hidden=true;
    sel={};exitSel();
    $('pickDown').hidden=!podeBaixar();
    render();
  }
  $('tabBeats').addEventListener('click',function(){setTab('beats')});
  $('tabSons').addEventListener('click',function(){setTab('sons')});

  $('searchBtn').addEventListener('click',function(){
    var b=$('searchbox');
    b.hidden=!b.hidden;
    if(!b.hidden)$('q').focus();
    else{$('q').value='';query='';cur=-1;render()}
  });
  $('q').addEventListener('input',function(e){query=e.target.value;cur=-1;render()});

  var ICON_DOWN='<path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>';
  var ICON_SEND='<path d="M7 17L17 7"/><path d="M9 7h8v8"/>';

  $('orderBtn').addEventListener('click',function(){
    open('<h2 id="cardTitle">Ordem</h2><p>Como a lista aparece</p>'+
      '<div class="card-list">'+opt('recentes','Recentes')+opt('az','A a Z')+
      (tab==='beats'?opt('bpm','BPM'):'')+
      '</div><button class="card-close" data-close>Fechar</button>');
    card.querySelectorAll('[data-sort]').forEach(function(b){
      b.addEventListener('click',function(){
        sort=b.dataset.sort;$('orderLabel').textContent=b.dataset.label;
        cur=-1;close();render();
      });
    });
  });
  function opt(v,label){
    return '<button type="button" data-sort="'+v+'" data-label="'+label+'">'+
      '<span style="width:18px;display:flex">'+(sort===v?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 12.5l5 5 9-10"/></svg>':'')+'</span>'+
      label+'</button>';
  }

  /* ---------- seleção ---------- */
  function enterSel(action){
    selAction=action;selMode=true;
    audio.pause();player.hidden=true;dlDock.hidden=false;$('selbar').hidden=false;
    $('doIcon').innerHTML = action==='send'?ICON_SEND:ICON_DOWN;
    render();updateSel();
    if(window.innerWidth<900) $('selbar').scrollIntoView({block:'start',behavior:'smooth'});
  }
  function exitSel(){
    selMode=false;sel={};dlDock.hidden=true;$('selbar').hidden=true;
    render();
    if(cur>-1)player.hidden=false;
  }
  function toggleSel(id){sel[id]=!sel[id];render();updateSel()}
  function picked(){return rows.filter(function(t){return sel[t.id]})}
  function updateSel(){
    var n=picked().length;
    $('selCount').textContent = n===1?'1 faixa':n+' faixas';
    $('doAct').disabled=!n;
    $('doLabel').textContent = (selAction==='send'?'Enviar':'Baixar')+(n?' '+n:'');
    $('selAll').textContent = (n===rows.length&&n)?'Limpar':'Selecionar tudo';
  }
  $('pickDown').addEventListener('click',function(){
    if(preview){downSheet(preview);return}
    enterSel('down');
  });
  $('pickSend').addEventListener('click',function(){enterSel('send')});
  $('selCancel').addEventListener('click',exitSel);
  $('selAll').addEventListener('click',function(){
    var all=picked().length===rows.length;
    sel={};if(!all)rows.forEach(function(t){sel[t.id]=true});
    render();updateSel();
  });
  $('doAct').addEventListener('click',function(){
    var p=picked();
    if(selAction==='send')sendSheet(p);else downSheet(p);
  });


  /* ---------- folhas ---------- */
  function open(html){
    card.innerHTML=html;veil.hidden=false;
    card.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',close)});
  }
  function close(){veil.hidden=true;card.innerHTML=''}
  veil.addEventListener('click',function(e){if(e.target===veil)close()});

  function trackSheet(t){
    var linhas =
      (CAT.owner || (!preview && !CAT.preview) ? item('send',ICON_SEND,'Enviar só essa faixa') : '') +
      (podeBaixar() ? item('down',ICON_DOWN,'Baixar') : '');
    if(!linhas){ flash('Essa faixa está só pra ouvir.'); return; }
    open('<h2 id="cardTitle">'+esc(t.title)+'</h2><p>'+esc(sub(t,false)||'faixa')+' · '+mmss(t.dur)+'</p>'+
      '<div class="card-list">'+linhas+'</div><button class="card-close" data-close>Fechar</button>');
    var s1=card.querySelector('[data-act=send]');
    if(s1) s1.addEventListener('click',function(){sendSheet([t])});
    var s2=card.querySelector('[data-act=down]');
    if(s2) s2.addEventListener('click',function(){downSheet([t])});
  }
  function item(act,path,label,filled){
    return '<button type="button" data-act="'+act+'">'+
      '<svg width="19" height="19" viewBox="0 0 24 24" '+(filled?'fill="#efefef"':'fill="none" stroke="#efefef" stroke-width="1.9"')+'>'+path+'</svg>'+
      label+'</button>';
  }

  function downSheet(p){
    if(!podeBaixar()){ flash('Essa pasta está só pra ouvir.'); return; }
    var w=p.reduce(function(a,t){return a+(t.wav||0)},0);
    var m=p.reduce(function(a,t){return a+(t.mp3||0)},0);
    var quantas = p.length===1 ? esc(p[0].title) : p.length+' faixas';
    open('<h2 id="cardTitle">Baixar</h2><p>'+quantas+'</p>'+
      '<div class="fmt">'+
        '<button type="button" data-fmt="mp3"><b>MP3</b><span>pra ouvir</span><em>'+mb(m)+'</em></button>'+
        '<button type="button" data-fmt="wav"><b>WAV</b><span>pra estúdio</span><em>'+mb(w)+'</em></button>'+
      '</div><button class="card-close" data-close>Cancelar</button>');
    card.querySelectorAll('[data-fmt]').forEach(function(b){
      b.addEventListener('click',function(){ close(); baixar(p, b.dataset.fmt); if(selMode)exitSel(); });
    });
  }

  function baixar(p, fmt){
    var i=0;
    (function proximo(){
      if(i>=p.length){ if(p.length>1) flash('Pronto, ' + p.length + ' arquivos.'); return; }
      var t=p[i++];
      if(p.length>1) flash('Baixando '+i+' de '+p.length+'…');
      var a=document.createElement('a');
      a.href='/dl/'+t.id+'?f='+fmt+(CAT.code?'&c='+encodeURIComponent(CAT.code):'');
      a.download='';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(proximo, 1400);
    })();
  }

  function sendSheet(p){
    open('<h2 id="cardTitle">Enviar</h2><p>Preparando o link…</p>');
    fetch('/api/link',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({ ids:p.map(function(t){return t.id}), code:CAT.code, artistId:CAT.artist.id })
    }).then(function(r){return r.json()}).then(function(j){
      if(!j.url) throw new Error('sem link');
      var desc = p.length===1
        ? 'Link só dessa faixa. Quem abrir ouve na hora, sem conta e sem app.'
        : 'Link só com as '+p.length+' faixas que você marcou. Quem abrir ouve na hora, sem conta e sem app.';
      open('<h2 id="cardTitle">Enviar</h2><p>'+desc+'</p>'+
        '<div class="linkbox"><code>'+esc(j.url.replace(/^https?:\/\//,''))+'</code>'+
        '<button class="ghost" data-act="copy" type="button">Copiar</button></div>'+
        '<button class="card-close" data-close>Fechar</button>');
      card.querySelector('[data-act=copy]').addEventListener('click',function(){
        if(navigator.clipboard) navigator.clipboard.writeText(j.url);
        flash('Link copiado.');
      });
    }).catch(function(){
      open('<h2 id="cardTitle">Enviar</h2><p>Não consegui gerar o link agora. Tenta de novo.</p>'+
        '<button class="card-close" data-close>Fechar</button>');
    });
  }

  /* ---------- o artista troca a capa ---------- */
  function ligarCapa(){
    var botao=$('trocarCapa'), campo=$('arquivoCapa');
    if(!botao||!campo) return;
    // só no catálogo do artista, nunca num link avulso nem numa beat tape
    if(CAT.preview || !CAT.code || CAT.artist.tape) return;
    var jaTrocou = !!CAT.artist.capaDoArtista;
    botao.hidden = jaTrocou;
    // depois da primeira troca o botão sai de cima da arte: a capa inteira vira o toque
    var capa=$('capa');
    capa.style.cursor='pointer';
    capa.addEventListener('click',function(e){
      if(e.target.closest('.trocar')) return;
      if(!jaTrocou) return;
      menuDaCapa();
    });

    function menuDaCapa(){
      open('<h2 id="cardTitle">Capa do catálogo</h2><p>Altere quantas vezes quiser.</p>'+
        '<div class="card-list">'+
        item('trocar','<path d="M3 8.5A1.5 1.5 0 014.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0121 8.5v9A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5z"/><circle cx="12" cy="12.5" r="3.2"/>','Trocar a imagem')+
        item('tirar','<path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/>','Voltar pra capa padrão')+
        '</div><button class="card-close" data-close>Fechar</button>');
      card.querySelector('[data-act=trocar]').addEventListener('click',function(){ close(); campo.click() });
      card.querySelector('[data-act=tirar]').addEventListener('click',function(){
        close();
        fetch('/api/capa?a='+encodeURIComponent(location.pathname.split('/')[1])+'&c='+encodeURIComponent(CAT.code),{method:'DELETE'})
          .then(function(r){return r.json()}).then(function(j){
            if(!j.ok){ flash(j.erro||'Não consegui tirar a capa.'); return; }
            CAT.artist.cover=null; CAT.artist.capaDoArtista=false;
            jaTrocou=false; botao.hidden=false;
            aplicarCapa();
            flash('Voltou a capa padrão.');
          }).catch(function(){ flash('Não consegui tirar a capa.') });
      });
    }

    botao.addEventListener('click',function(){ campo.click() });
    campo.addEventListener('change',function(){
      var arq=campo.files && campo.files[0];
      campo.value='';
      if(!arq) return;
      if(!/^image\//.test(arq.type)){ flash('Manda uma imagem.'); return; }
      if(arq.size > 20*1048576){ flash('Essa imagem é pesada demais.'); return; }
      botao.disabled=true;
      var antes=botao.innerHTML;
      botao.textContent='Subindo…';
      quadrado(arq, 1000).then(function(blob){
        return fetch('/api/capa?a='+encodeURIComponent(location.pathname.split('/')[1])+'&c='+encodeURIComponent(CAT.code),{
          method:'POST', headers:{'content-type':'image/jpeg'}, body:blob
        });
      }).then(function(r){ return r.json() }).then(function(j){
        botao.disabled=false;botao.innerHTML=antes;
        if(!j.ok){ flash(j.erro||'Não consegui trocar a capa.'); return; }
        CAT.artist.cover=j.capa+'?v='+Date.now();
        CAT.artist.capaDoArtista=true;
        aplicarCapa();
        if(!jaTrocou){
          jaTrocou=true;
          botao.hidden=true;
          flash('Capa trocada. Pra mexer de novo, é só tocar na capa.');
        } else {
          flash('Capa trocada.');
        }
      }).catch(function(){
        botao.disabled=false;botao.innerHTML=antes;
        flash('Não consegui trocar a capa.');
      });
    });
  }

  // corta no centro e reduz, pra subir leve e sair sempre quadrada
  function quadrado(arquivo, lado){
    return new Promise(function(ok, falhou){
      var img=new Image();
      img.onload=function(){
        var l=Math.min(img.width,img.height);
        var cv=document.createElement('canvas');
        cv.width=lado;cv.height=lado;
        cv.getContext('2d').drawImage(img,(img.width-l)/2,(img.height-l)/2,l,l,0,0,lado,lado);
        cv.toBlob(function(b){ b?ok(b):falhou() },'image/jpeg',0.86);
        URL.revokeObjectURL(img.src);
      };
      img.onerror=falhou;
      img.src=URL.createObjectURL(arquivo);
    });
  }

  /* ---------- toast ---------- */
  var tid;
  function flash(msg){
    clearTimeout(tid);
    var el=$('toast');el.textContent=msg;el.hidden=false;el.style.opacity='1';
    tid=setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.hidden=true},260)},2600);
  }

  /* ---------- partida ---------- */
  function contagem(){
    var b=BEATS.length, s=SONS.length, p=[];
    if(b) p.push(b+(b===1?' beat':' beats'));
    if(s) p.push(s+(s===1?' música':' músicas'));
    return p.join(', ') || 'catálogo vazio';
  }

  function aplicarCapa(){
    var c=$('capa');
    if(!CAT.artist.cover){
      c.style.backgroundImage='';
      if(!c.querySelector('.logo')) c.insertAdjacentHTML('afterbegin','<span class="logo logo-v" role="img" aria-label="Caramujo Records"></span>');
      return;
    }
    var arte="url('"+CAT.artist.cover+"')";
    var marca=c.querySelector('.logo');
    if(marca) marca.remove();
    c.style.backgroundImage=arte;
    var bg=$('fundo');
    if(bg) bg.style.backgroundImage=arte;
    var mini=document.querySelector('.pl-art');
    if(mini){
      var m=mini.querySelector('.logo');
      if(m) m.remove();
      mini.style.backgroundImage=arte;
      mini.style.backgroundSize='cover';
      mini.style.backgroundPosition='center';
    }
  }

  function inicio(){
    $('nome').textContent=CAT.artist.name||'';
    $('who').textContent=CAT.artist.who||'@rideblan33';
    $('count').textContent=contagem();
    if(CAT.artist.descricao){
      $('recado').textContent=CAT.artist.descricao;
      $('recado').hidden=false;
    }
    document.title=(CAT.artist.name||'Catálogo')+' · Caramujo Records';

    aplicarCapa();

    if(!SONS.length){ $('tabSons').hidden=true; }
    if(!BEATS.length && SONS.length){ tab='sons'; $('tabBeats').hidden=true;
      $('tabSons').setAttribute('aria-selected','true'); $('tabBeats').setAttribute('aria-selected','false'); }

    $('pickDown').hidden=!podeBaixar();

    if(CAT.preview){
      document.body.classList.add('is-preview');
      $('pickSend').hidden=true;
      $('count').textContent=CAT.tracks.length===1?'1 faixa':CAT.tracks.length+' faixas';
    }

    ligarCapa();
    render();
    envia({ kind:'open', artistId:CAT.artist.id, code:CAT.code });

  }

  inicio();
})();
</script>
</body>
</html>
